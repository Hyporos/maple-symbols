name: Game data check

# The site shipped GMS v.271's doubled symbol rates two weeks late because nothing
# watched for it (KI-014). Every Monday this compares our numbers with the MapleStory
# Wiki and reads the patch notes of GMS and of the regions that patch before it
# (scripts/check-game-data.mjs; the sources are listed at its top and in GAME §6).
#
# It writes to GitHub only when something changed: it opens an issue (label
# `game-data`) the first time the report is not clean, comments only when the report
# differs from the last one posted, and closes the issue once everything matches
# again. It never edits the data: a patch can describe another region or a temporary
# event bonus, so a person decides.
#
# NOTE: GitHub only runs scheduled workflows from the default branch, so the Monday run
# starts once this file reaches `main`. Until then use `pnpm check:data` or Run workflow.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Compare our symbol data with the wiki and the patch notes
        id: check
        run: |
          set +e
          node scripts/check-game-data.mjs > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open, update or close the game-data issue
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.check.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const status = Number(process.env.STATUS);
            const report = fs.readFileSync("report.txt", "utf8").trim();
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "game-data",
            });
            // The label can sit on a pull request too; only issues count.
            const issue = open.data.find((i) => !i.pull_request);

            // Clean report: close a still-open issue, otherwise stay silent.
            if (status === 0) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Everything matches again. Closing. ([run](${run}))`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed",
                });
              }
              return;
            }

            const headline = {
              1: "our numbers no longer match the game",
              2: "a source could not be read",
              3: "a patch note mentions symbols",
            }[status] ?? `the check exited with ${status}`;
            const block = "```\n" + report + "\n```";
            const body = [
              `The weekly game-data check: ${headline}.`,
              "",
              block,
              "",
              "Before changing anything, confirm the patch notes: the wiki may describe another",
              "region, a temporary event bonus, or a change GMS has not received yet.",
              "Then follow the checklist in `docs/GAME.md` §6 and record the check in §7.",
              "",
              `[This run](${run})`,
            ].join("\n");

            if (!issue) {
              await github.rest.issues.create({
                owner, repo, title: `Game data check: ${headline}`, body, labels: ["game-data"],
              });
              return;
            }

            // Post only when the report differs from the last one this workflow posted
            // (a person's comment in between does not count).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const ours = comments.filter((c) => c.user?.type === "Bot");
            const last = ours.length ? ours[ours.length - 1].body : issue.body;
            if (last && last.includes(block)) {
              core.info("Same report as last time; nothing posted.");
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            const title = `Game data check: ${headline}`;
            if (issue.title !== title) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, title });
            }
