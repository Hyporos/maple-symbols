name: Game data check

# The site shipped GMS v.271's doubled symbol rates two weeks late because nothing
# watched for it (KI-014). This compares our numbers with the MapleStory Wiki every
# Monday and opens an issue when they disagree. It never edits the data itself:
# a patch can describe another region or a temporary event bonus, so a person decides.
#
# NOTE: GitHub only runs scheduled workflows from the default branch, so the Monday run
# starts once this file reaches `main`. Until then use `pnpm check:data` or Run workflow.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Compare our symbol data with the wiki
        id: check
        run: |
          set +e
          node scripts/check-game-data.mjs > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update an issue when something moved
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("report.txt", "utf8");
            const title = "Game data check: the symbol numbers moved";
            const body = [
              "The weekly check found game data that no longer matches ours.",
              "",
              "```",
              report.trim(),
              "```",
              "",
              "Before changing anything, confirm the patch notes: the wiki may describe another",
              "region, a temporary event bonus, or a change GMS has not received yet.",
              "Then follow the checklist in `docs/GAME.md` §6 and record the check in §7.",
              "",
              `[This run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "game-data",
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["game-data"],
              });
            }
