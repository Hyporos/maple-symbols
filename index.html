  <script>
    (() => {
      const path = window.location.pathname.replace(/\/+$/, "") || "/";
      const pageMap = {
        "/": {
          title: "MapleStory Arcane & Sacred Symbol Calculator | Maple Symbols",
          description: "The ultimate MapleStory symbol calculator for Arcane and Sacred symbols. Track daily and weekly quest progress, estimate completion dates, and plan your symbol leveling strategy.",
          url: "https://maplesymbols.com/",
        },
        "/handbook": {
          title: "Symbol Handbook | Maple Symbols",
          description: "Complete Arcane and Sacred Symbol reference: experience tables, meso upgrade costs, and daily/weekly quest ratios for every MapleStory region.",

          url: "https://maplesymbols.com/changelog",

        "/credits": {

          description: "Attributions and acknowledgements for Maple Symbols.",
          url: "https://maplesymbols.com/credits",
        },
      };

      const page = pageMap[path] || pageMap["/"];
      document.title = page.title;

      const setMeta = (selector, attribute, value) => {
        const element = document.querySelector(selector);
        if (element) {
          element.setAttribute(attribute, value);
        }
      };

      setMeta('meta[name="description"]', "content", page.description);
      setMeta('meta[property="og:url"]', "content", page.url);
      setMeta('meta[property="og:title"]', "content", page.title);
      setMeta('meta[property="og:description"]', "content", page.description);
      setMeta('meta[name="twitter:url"]', "content", page.url);
      setMeta('meta[name="twitter:title"]', "content", page.title);
      setMeta('meta[name="twitter:description"]', "content", page.description);
      setMeta('link[rel="canonical"]', "href", page.url);
    })();
  </script>
